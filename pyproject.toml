[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parametric-sensor-mount"
version = "0.1.0"
description = "A code-generated pan mount for an ultrasonic sensor, with automated fit and collision checks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Oluwaniyi Victor Momoh" }]
dependencies = ["manifold3d>=2.5", "networkx>=3", "numpy>=1.26", "rtree>=1.2", "scipy>=1.11", "trimesh>=4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
